# Publica la app web (la carpeta web/) en GitHub Pages en cada push a main,
# después de que pase la prueba de humo. La dirección no cambia:
# https://tmrainer.github.io/PI3-Proyecto/

name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llega otra, la que estaba en curso termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  humo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prueba de humo
        env:
          CHROME: /usr/bin/google-chrome
        run: node herramientas/humo.mjs

  publicar:
    needs: humo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
