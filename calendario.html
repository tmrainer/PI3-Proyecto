<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">

     solo se cargan archivos de este mismo sitio y no hay scripts en línea. -->

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Controla cuándo toca entregar el siguiente Formato B-1 y cuántos días faltan.">
<meta name="robots" content="noindex, nofollow">
<title>Entregas · Sistema de Asistencia</title>
<meta name="theme-color" content="#1b2e1e">
<link rel="manifest" href="./manifest.webmanifest">

<link rel="stylesheet" href="./estilos.css">
<script src="./js/errores.js"></script>
<script src="./js/preferencias.js"></script>

     hasta que su módulo la arma (se ejecuta igual al terminar de leerla). -->

</head>
<body data-pagina="calendario">
<a class="saltar-al-contenido" href="#principal">Saltar al contenido</a>
<header class="cabecera">
  <div class="cabecera-titulo">
    <a class="cabecera-volver" href="./" aria-label="Volver al inicio" title="Volver al inicio"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icono"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>Entregas</h1>
    <p class="cabecera-sub"></p>
    <button type="button" class="cabecera-voz" aria-label="Leer esta pantalla en voz alta" title="Leer en voz alta"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icono"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button type="button" class="cabecera-menu" aria-label="Más opciones" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icono"><path d="M12 5h.01M12 12h.01M12 19h.01"/></svg></button>
  </div>
  <!-- El menú está escrito aquí, no lo arma el JS: así existe desde el primer
       cuadro y no desaparece al pasar de una pantalla a otra. -->
  <nav class="nav" aria-label="Secciones">
    <a href="./" class="nav-enlace"><span class="nav-icono"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icono"><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/></svg></span><span class="nav-texto">Inicio</span></a>
    <a href="./asistencia.html" class="nav-enlace"><span class="nav-icono"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icono"><path d="M4 6l2 2 3-3M4 13l2 2 3-3M12 7h8M12 14h8M5 20h1M12 20h8"/></svg></span><span class="nav-texto">Asistencia</span></a>
    <a href="./padron.html" class="nav-enlace"><span class="nav-icono"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icono"><path d="M12.5 8a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5M19.5 9a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0M17 14c2.5 0 4 1.5 4.5 4"/></svg></span><span class="nav-texto">Padrón</span></a>
    <a href="./formato-b1.html" class="nav-enlace"><span class="nav-icono"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icono"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg></span><span class="nav-texto">B-1</span></a>
    <a href="./calendario.html" class="nav-enlace activo" aria-current="page"><span class="nav-icono"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icono"><path d="M5.5 5h13a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3.5 10h17M8 3v4M16 3v4M8 14h2M12 14h2"/></svg></span><span class="nav-texto">Entregas</span></a>
  </nav>
</header>
<main id="principal" tabindex="-1">

  <div id="avisos-sistema"></div>
  <div id="banner"></div>
  <div id="cuenta-regresiva"></div>
  <div id="panel" class="panel" role="status" aria-live="polite" aria-label="Resumen de revisión"></div>

  <section class="bloque">
    <h2>Cada cuánto entregas</h2>
    <div class="rejilla tres">
      <div class="campo" data-campo="calendario.periodicidad">
        <label for="periodicidad">Cada cuánto</label>
        <select id="periodicidad">
          <option value="semanal">Semanal (cada 7 días)</option>
          <option value="quincenal">Quincenal (cada 15 días)</option>
          <option value="mensual">Mensual (mismo día de cada mes)</option>
        </select>
      </div>
      <div class="campo" data-campo="calendario.base">
        <label for="fechaBase">Una fecha de entrega que conoces</label>
        <input id="fechaBase" type="date">
        <span class="pista">La próxima o una pasada, da igual.</span>
      </div>
    </div>
    <fieldset style="margin-top:12px">
      <legend>Avisarme</legend>
      <div class="opciones" id="dias-aviso"></div>
      <p class="campo-error" id="dias-aviso-msg" role="status"></p>
    </fieldset>
  </section>

  <section class="bloque">
    <h2>Próximas entregas</h2>
    <div id="estado-b1"></div>
    <div id="agenda"></div>
    <p class="nota-calculo" id="nota-avisos">El aviso se ve al abrir la aplicación.</p>
    <div id="avisos-telefono"></div>
  </section>

  <p class="estado-guardado barra-estado" id="estado-guardado">Se guarda solo, mientras escribes.</p>


</main>
</body>
</html>
