<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<!-- La regla de AGENTS.md §3 (nada sale del dispositivo) la impone el navegador:
     solo se cargan archivos de este mismo sitio y no hay scripts en línea. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Controla cuándo toca entregar el siguiente Formato B-1 y cuántos días faltan.">
<meta name="robots" content="noindex, nofollow">
<title>Entregas · Sistema de Asistencia</title>
<meta name="theme-color" content="#1b2e1e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icono-180.png">
<link rel="stylesheet" href="./estilos.css">
<script src="./js/errores.js"></script>
</head>
<body data-pagina="calendario">
<a class="saltar-al-contenido" href="#principal">Saltar al contenido</a>
<header class="cabecera">
  <div class="cabecera-titulo">
    <h1>Sistema de Asistencia</h1>
    <p class="cabecera-sub">Ollas comunes y comedores de Villa María del Triunfo</p>
  </div>
  <nav class="nav" aria-label="Secciones"></nav>
</header>
<main id="principal" tabindex="-1">

  <div id="avisos-sistema"></div>
  <div id="banner"></div>
  <div id="panel" class="panel" role="status" aria-live="polite" aria-label="Resumen de revisión"></div>

  <section class="bloque">
    <h2>Cada cuánto entregas</h2>
    <div class="rejilla tres">
      <div class="campo" data-campo="calendario.periodicidad">
        <label for="periodicidad">Cada cuánto</label>
        <select id="periodicidad">
          <option value="semanal">Semanal (cada 7 días)</option>
          <option value="quincenal">Quincenal (cada 15 días)</option>
          <option value="mensual">Mensual (mismo día de cada mes)</option>
        </select>
      </div>
      <div class="campo" data-campo="calendario.base">
        <label for="fechaBase">Una fecha de entrega que conoces</label>
        <input id="fechaBase" type="date">
        <span class="pista">La próxima o una pasada, da igual.</span>
      </div>
    </div>
    <fieldset style="margin-top:12px">
      <legend>Avisarme</legend>
      <div class="opciones" id="dias-aviso"></div>
      <p class="campo-error" id="dias-aviso-msg" role="status"></p>
    </fieldset>
  </section>

  <section class="bloque">
    <h2>Próximas entregas</h2>
    <div id="estado-b1"></div>
    <div id="agenda"></div>
    <p class="nota-calculo">El aviso se ve al abrir la aplicación.</p>
  </section>

  <p class="estado-guardado barra-estado" id="estado-guardado">Se guarda solo, mientras escribes.</p>

  <details class="plegable">
    <summary>Copia de tus datos y privacidad</summary>
    <div class="plegable-cuerpo">
      <div id="privacidad"></div>
      <div id="barra-datos"></div>
    </div>
  </details>

</main>
<script type="module" src="./js/pagina-calendario.js"></script>
</body>
</html>
